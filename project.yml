name: Lasso

options:
  bundleIdPrefix: dev.lasso
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
    # Set your own team in .env (DEVELOPMENT_TEAM=...) — never committed.
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

configs:
  Debug:
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  Release:
    SWIFT_COMPILATION_MODE: wholemodule
    SWIFT_OPTIMIZATION_LEVEL: -O

# Every dependency is a local package or pinned by exact revision. No analytics, crash
# reporting or ad SDKs — `make audit` fails the build if one appears.
packages:
  HerdrKit:
    path: Packages/HerdrKit
  LassoSSH:
    path: Packages/LassoSSH
  LassoCore:
    path: Packages/LassoCore
  # Terminal renderer. Exact revision reviewed by Heeler (Ghostty 82938b633ba6); its libghostty
  # binary is a checksummed prebuilt — the one accepted prebuilt, see docs/dependencies.md.
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm.git
    revision: "7e45d27160f9b34aca9ca5c9820e9207482f9f04"

targets:
  Lasso:
    type: application
    platform: iOS
    sources:
      - path: App/Lasso
    dependencies:
      - package: HerdrKit
      - package: LassoSSH
      - package: LassoCore
      - package: GhosttyTerminal
        product: GhosttyTerminal
    info:
      path: App/Lasso/Info.plist
      properties:
        CFBundleDisplayName: Lasso
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Lasso connects over SSH to the herdr hosts you add on your local network.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.lasso.refresh]
  LassoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/LassoTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lasso

  LassoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/LassoUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lasso

schemes:
  Lasso:
    build:
      targets:
        Lasso: all
    test:
      targets:
        - LassoTests
  LassoUI:
    build:
      targets:
        Lasso: all
        LassoUITests: [test]
    test:
      targets:
        - LassoUITests
